name: Lint

on:
  push:
    branches: [ "main", "feature/*", "fix/*" ]
  pull_request:
    branches: [ "main", "feature/*", "fix/*" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ESLint (v10+) on generate-constellation.js
        run: |
          npx eslint@latest generate-constellation.js \
          --no-config-lookup \
          --language-options '{"globals": {"window": "readonly", "document": "readonly"}}'

      - name: Lint HTML
        run: npx htmlhint "index.html"