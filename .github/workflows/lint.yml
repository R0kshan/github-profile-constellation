name: Lint JavaScript

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ESLint (v10+)
        run: npx eslint@latest generate-constellation.js --no-config-lookup --language-options '{"globals": {"window": "readonly", "document": "readonly"}}'