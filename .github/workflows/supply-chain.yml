name: Supply chain
on:
  push:
    branches: [ "main", "feature/*", "fix/*", "chore/*" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  dependency-review:
    # Compares the dependency manifest of a base ref against a head ref, so it
    # only has the refs it needs on pull_request/merge_group events. On push it
    # would fail with "Both a base ref and head ref must be provided".
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
  audit-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      # zizmor audits the workflow files (pipx is preinstalled on the runner).
      # --min-severity high: fail the build only on high-confidence, high-impact
      # findings; lower-severity notes are printed but don't block.
      - run: pipx run zizmor --min-severity high .github/workflows

